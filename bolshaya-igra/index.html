document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ba(246,238,226,.22);color:#F6EEE2;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;\">✕<\u002Fspan>\n<\u002Fspan>\n<span style=\"font-size:clamp(16px,4.2vw,18px);line-height:1.4;font-weight:600;color:#F6EEE2;\">{{ p.t }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:#1F1F1F;color:#F6EEE2;border-radius:18px;padding:clamp(20px,3vw,28px);\">\n<div style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:8px;\">\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(18px,4.6vw,24px);font-weight:800;letter-spacing:-.02em;line-height:1.25;color:#F6EEE2;\">Каждый из этих пунктов <span style=\"white-space:nowrap;\">не про лень<\u002Fspan><\u002Fspan>\n<p style=\"margin:0;font-size:clamp(15px,4vw,17px);line-height:1.5;color:rgba(246,238,226,.8);max-width:44rem;\">Просто у&nbsp;тебя нет метода, как снимать. Нет конкретного понимания, о&nbsp;чём снимать. И&nbsp;нет ответа на&nbsp;главное: как начать и&nbsp;не&nbsp;слиться через неделю.<\u002Fp>\n<\u002Fdiv>\n<a href=\"#tariffs\" style=\"flex:1 1 100%;display:flex;width:100%;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 clamp(24px,5vw,34px);border-radius:999px;background:#C05B3B;color:#F6EEE2;font-family:'Unbounded',sans-serif;font-size:clamp(15px,4.2vw,18px);font-weight:700;letter-spacing:-.01em;white-space:nowrap;\" style-hover=\"background:#A44A2E;\">Пройти отбор →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 Для кого\" data-reveal=\"\" style=\"background:#E3768B;padding:clamp(56px,10vw,112px) 0;\">\n<div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,40px);display:flex;flex-direction:column;gap:clamp(22px,3.4vw,32px);\">\n<div style=\"display:flex;flex-direction:column;gap:10px;\">\n<h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(30px,6vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.02em;color:#F6EEE2;\">Для кого<br><span style=\"white-space:nowrap;\">Большая игра?<\u002Fspan><\u002Fh2>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#F6EEE2;\">если это про тебя<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n<sc-for list=\"{{ niches }}\" as=\"n\" hint-placeholder-count=\"24\">\n<span style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(246,238,226,.16);border:1px solid rgba(246,238,226,.32);font-size:15px;font-weight:600;color:#F6EEE2;white-space:nowrap;\"><span style=\"font-size:18px;line-height:1;\">{{ n.e }}<\u002Fspan>{{ n.t }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;padding-top:clamp(14px,2.4vw,22px);border-top:1px solid rgba(246,238,226,.35);align-items:flex-start;\">\n<p style=\"margin:0;font-size:clamp(17px,4.4vw,20px);line-height:1.4;font-weight:700;color:#F6EEE2;max-width:40rem;\">Или просто хочешь показывать свою жизнь и&nbsp;говорить то, что думаешь.<\u002Fp>\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(18px,4.6vw,26px);line-height:1.45;font-weight:800;letter-spacing:-.02em;\"><span style=\"display:inline;background:#F6EEE2;color:#1F1F1F;padding:.12em .3em;box-decoration-break:clone;-webkit-box-decoration-break:clone;\">Разница только в&nbsp;теме. Путь одинаковый для&nbsp;всех<\u002Fspan><\u002Fspan>\n<a href=\"#tariffs\" style=\"align-self:stretch;display:flex;width:100%;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 clamp(26px,6vw,38px);border-radius:999px;background:#C05B3B;color:#F6EEE2;font-family:'Unbounded',sans-serif;font-size:clamp(15px,4.2vw,18px);font-weight:700;letter-spacing:-.01em;white-space:nowrap;\" style-hover=\"background:#A44A2E;\">Пройти отбор →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 Метод яппинга\" data-reveal=\"\" style=\"background:#F6EEE2;color:#1F1F1F;padding:clamp(56px,10vw,112px) 0;\">\n<div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,40px);display:flex;flex-direction:column;gap:clamp(24px,3.6vw,36px);\">\n<div style=\"display:flex;flex-direction:column;gap:10px;\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9C6239;\">основа игры<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(30px,6vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.02em;color:#1F1F1F;\">Метод <span style=\"white-space:nowrap;\">ЯППИНГА<\u002Fspan><\u002Fh2>\n<p style=\"margin:0;font-size:clamp(18px,4.8vw,22px);line-height:1.35;font-weight:700;max-width:36rem;color:#1F1F1F;\">Если ты узнала себя выше, то&nbsp;лучшим методом для&nbsp;блогинга будет мой метод яппинга.<\u002Fp>\n<\u002Fdiv>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:14px;background:#1F1F1F;color:#F6EEE2;border-radius:18px;padding:clamp(34px,4.4vw,42px) clamp(20px,3vw,30px) clamp(20px,3vw,30px);margin-top:18px;\">\n<span style=\"position:absolute;top:-18px;left:clamp(20px,3vw,30px);display:inline-flex;align-items:center;height:36px;padding:0 18px;border-radius:999px;background:#1F1F1F;color:#F6EEE2;font-family:'Unbounded',sans-serif;font-size:clamp(13px,3.4vw,15px);font-weight:800;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 10px 24px -14px rgba(31,31,31,.7);\">Всё, что нужно для&nbsp;ролика<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n<span style=\"flex:1 1 160px;display:flex;flex-direction:column;gap:6px;background:rgba(246,238,226,.08);border-radius:14px;padding:16px 18px;\"><span style=\"font-size:22px;line-height:1;\">💡<\u002Fspan><span style=\"font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;\">Тема<\u002Fspan><\u002Fspan>\n<span style=\"flex:1 1 160px;display:flex;flex-direction:column;gap:6px;background:rgba(246,238,226,.08);border-radius:14px;padding:16px 18px;\"><span style=\"font-size:22px;line-height:1;\">🗣️<\u002Fspan><span style=\"font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;\">Рот<\u002Fspan><\u002Fspan>\n<span style=\"flex:1 1 160px;display:flex;flex-direction:column;gap:6px;background:rgba(246,238,226,.08);border-radius:14px;padding:16px 18px;\"><span style=\"font-size:22px;line-height:1;\">📱<\u002Fspan><span style=\"font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;\">Камера<\u002Fspan><\u002Fspan>\n<span style=\"flex:1 1 160px;display:flex;flex-direction:column;gap:6px;background:#F6EEE2;color:#1F1F1F;border-radius:14px;padding:16px 18px;\"><span style=\"font-size:22px;line-height:1;\">✂️<\u002Fspan><span style=\"font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;\">Монтаж на&nbsp;5&nbsp;минут<\u002Fspan><span style=\"font-size:14px;line-height:1.35;color:rgba(31,31,31,.7);\">вырезать «ааа», «эээ», добавить субтитры<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;\">\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(20px,5vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.2;color:#1F1F1F;\">Что тебе даёт этот метод<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;\">\n<div style=\"flex:1 1 250px;display:flex;flex-direction:column;gap:8px;background:#E3768B;color:#F6EEE2;border-radius:18px;padding:clamp(18px,2.8vw,26px);\">\n<span style=\"font-family:'Unbounded',sans-serif;font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1;color:#F6EEE2;\">01<\u002Fspan>\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(17px,4.4vw,20px);font-weight:700;letter-spacing:-.02em;line-height:1.25;\">Говоришь на&nbsp;камеру свободно<\u002Fspan>\n<span style=\"font-size:clamp(15px,4vw,17px);line-height:1.5;color:rgba(246,238,226,.9);\">Про&nbsp;что угодно и&nbsp;интересно, без сценария и&nbsp;без десяти дублей.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:1 1 250px;display:flex;flex-direction:column;gap:8px;background:#E3768B;color:#F6EEE2;border-radius:18px;padding:clamp(18px,2.8vw,26px);\">\n<span style=\"font-family:'Unbounded',sans-serif;font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1;color:#F6EEE2;\">02<\u002Fspan>\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(17px,4.4vw,20px);font-weight:700;letter-spacing:-.02em;line-height:1.25;\">Твои рилсы начинают смотреть<\u002Fspan>\n<span style=\"font-size:clamp(15px,4vw,17px);line-height:1.5;color:rgba(246,238,226,.9);\">Сотни тысяч просмотров и&nbsp;столько же новых подписчиков.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:1 1 100%;display:flex;flex-direction:column;gap:8px;background:#E3768B;color:#F6EEE2;border-radius:18px;padding:clamp(18px,2.8vw,26px);\">\n<span style=\"font-family:'Unbounded',sans-serif;font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1;color:#F6EEE2;\">03<\u002Fspan>\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(18px,4.8vw,24px);font-weight:800;letter-spacing:-.025em;line-height:1.25;\">Освоила один раз — дальше снимаешь легко и&nbsp;быстро<\u002Fspan>\n<span style=\"font-size:clamp(15px,4vw,17px);line-height:1.5;color:rgba(246,238,226,.9);\">Навык остаётся с&nbsp;тобой навсегда, даже когда игра закончится.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:14px;align-items:flex-start;max-width:44rem;border-left:3px solid #E3768B;padding-left:clamp(14px,3vw,20px);\">\n<img src=\"e9098f60-4203-4986-8985-f9b1761114ac\" alt=\"Карина\" style=\"width:44px;height:44px;flex:0 0 auto;border-radius:999px;object-fit:cover;display:block;\">\n<div style=\"display:flex;flex-direction:column;gap:8px;\">\n<p style=\"margin:0;font-size:clamp(17px,4.6vw,21px);line-height:1.4;font-weight:700;color:#1F1F1F;\">«По&nbsp;этому методу набрала свою аудиторию я&nbsp;и&nbsp;сотни других блогеров на&nbsp;всех языках мира. В&nbsp;Америке у&nbsp;блогеров сейчас это огромный тренд»<\u002Fp>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(31,31,31,.8);\">карина · @kerry.catt<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<a href=\"#tariffs\" style=\"align-self:stretch;display:flex;width:100%;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:0 clamp(26px,6vw,40px);border-radius:999px;background:#C05B3B;color:#F6EEE2;font-family:'Unbounded',sans-serif;font-size:clamp(16px,4.4vw,19px);font-weight:700;letter-spacing:-.01em;white-space:nowrap;\" style-hover=\"background:#A44A2E;\">Пройти отбор →<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"06 Задания\" data-reveal=\"\" style=\"background:#1F1F1F;color:#F6EEE2;padding:clamp(56px,10vw,112px) 0;\">\n<div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,40px);display:flex;flex-direction:column;gap:clamp(24px,3.6vw,34px);\">\n<div style=\"display:flex;flex-direction:column;gap:12px;\">\n<h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(28px,6vw,50px);line-height:1.04;font-weight:800;letter-spacing:-.025em;color:#F6EEE2;max-width:24ch;\">Тебе больше не надо думать, <span style=\"white-space:nowrap;\">о чём снимать<\u002Fspan><\u002Fh2>\n<div style=\"display:flex;gap:14px;align-items:flex-start;max-width:44rem;border-left:3px solid #F6EEE2;padding-left:clamp(14px,3vw,20px);\">\n<img src=\"e9098f60-4203-4986-8985-f9b1761114ac\" alt=\"Карина\" style=\"width:44px;height:44px;flex:0 0 auto;border-radius:999px;object-fit:cover;display:block;\">\n<div style=\"display:flex;flex-direction:column;gap:8px;\">\n<p style=\"margin:0;font-size:clamp(16px,4.2vw,19px);line-height:1.5;font-weight:600;color:#F6EEE2;\">«Вы мне постоянно говорили, что не&nbsp;понимаете, что снимать. Даже когда тема есть, непонятно, как снять по&nbsp;ней ролик. Именно поэтому за&nbsp;40&nbsp;дней ты получишь 30&nbsp;заданий: что и&nbsp;как нужно снять. Каждое задание можно адаптировать под&nbsp;свою тему»<\u002Fp>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,238,226,.55);\">карина · @kerry.catt<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;\">\n<div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:10px;background:rgba(246,238,226,.07);border:1px solid rgba(246,238,226,.16);border-radius:18px;padding:clamp(20px,2.8vw,26px);\">\n<span style=\"display:flex;align-items:center;gap:8px;\"><span style=\"font-size:20px;line-height:1;\">💬<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F6EEE2;\">пример задания 1<\u002Fspan><\u002Fspan>\n<span style=\"font-size:clamp(16px,4.2vw,18px);line-height:1.4;font-weight:600;color:#F6EEE2;\">Ответь на&nbsp;вопрос, который тебе задают чаще всего<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:10px;background:rgba(246,238,226,.07);border:1px solid rgba(246,238,226,.16);border-radius:18px;padding:clamp(20px,2.8vw,26px);\">\n<span style=\"display:flex;align-items:center;gap:8px;\"><span style=\"font-size:20px;line-height:1;\">🌤️<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F6EEE2;\">пример задания 2<\u002Fspan><\u002Fspan>\n<span style=\"font-size:clamp(16px,4.2vw,18px);line-height:1.4;font-weight:600;color:#F6EEE2;\">Покажи момент из&nbsp;своего обычного дня и&nbsp;скажи, что ты о&nbsp;нём думаешь<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:10px;background:rgba(246,238,226,.07);border:1px solid rgba(246,238,226,.16); 100%;max-width:44rem;\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(31,31,31,.8);\">как в игре<\u002Fspan>\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(17px,4.4vw,21px);font-weight:700;letter-spacing:-.02em;line-height:1.3;\">На Большой игре мы делаем весь фокус на&nbsp;съёмку и&nbsp;публикацию рилсов<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-family:'Unbounded',sans-serif;font-size:clamp(24px,6.4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.1;color:#F6EEE2;max-width:24ch;\">По-другому блогером стать невозможно<\u002Fspan>\n<a href=\"#tariffs\" style=\"align-self:stretch;display:flex;width:100%;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 clamp(26px,6vw,38px);border-radius:999px;background:#C05B3B;color:#F6EEE2;font-family:'Unbounded',sans-serif;font-size:clamp(15px,4.2vw,18px);font-weight:700;letter-spacing:-.01em;white-space:nowrap;\" style-hover=\"background:#A44A2E;\">Пройти отбор →<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"08 Куратор\" data-reveal=\"\" style=\"background:#F6EEE2;color:#1F1F1F;padding:clamp(56px,10vw,112px) 0;\">\n<div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,40px);display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,44px);align-items:flex-start;\">\n<div style=\"flex:1 1 100%;display:flex;flex-direction:column;gap:10px;\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9C6239;\">поддержка внутри игры<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(28px,5.6vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.02em;color:#1F1F1F;max-width:18ch;\">Ты идёшь <span style=\"white-space:nowrap;\">не одна<\u002Fspan><\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex:1 1 280px;display:flex;flex-direction:column;gap:12px;background:#1F1F1F;color:#F6EEE2 r;gap:10px;min-height:64px;padding:0 34px;border-radius:999px;background:#C05B3B;color:#F6EEE2;font-family:'Unbounded',sans-serif;font-size:clamp(16px,4.4vw,20px);font-weight:700;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 14px 34px -12px rgba(31,31,31,.8);\" style-hover=\"background:#A44A2E;\">Пройти отбор →<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#1F1F1F;color:rgba(246,238,226,.5);padding:0 0 clamp(28px,5vw,44px);\">\n<div style=\"max-width:1120px;margin:0 auto;padding:28px clamp(20px,5vw,40px) 0;display:flex;flex-direction:column;gap:18px;\">\n<div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;\">\n<span style=\"font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(18px,4.6vw,22px);color:#F6EEE2;\">Большая игра<\u002Fspan>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;\">© карина каталеева<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;\">\n<a href=\"#\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,238,226,.55);\" style-hover=\"color:#F6EEE2;\">Оферта<\u002Fa>\n<a href=\"#\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,238,226,.55);\" style-hover=\"color:#F6EEE2;\">Политика обработки персональных данных<\u002Fa>\n<a href=\"#\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,238,226,.55);\" style-hover=\"color:#F6EEE2;\">Согласие на информационные и маркетинговые рассылки<\u002Fa>\n<\u002Fdiv>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;\">большая игра · @kerry.catt · старт 17 августа<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<div style=\"position:fixed;left:0;right:0       this.setState({ pct: h > 0 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0 });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));\n    if (reduce || !('IntersectionObserver' in window)) return;\n    nodes.forEach(n => {\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(12px)';\n      n.style.transition = 'opacity 420ms cubic-bezier(.22,1,.36,1), transform 420ms cubic-bezier(.22,1,.36,1)';\n    });\n    this.io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          this.io.unobserve(e.target);\n        }\n      });\n    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.06 });\n    nodes.forEach(n => this.io.observe(n));\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.t);\n    if (this.io) this.io.disconnect();\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n  }\n\n  plural(n, forms) {\n    const a = Math.abs(n) % 100, b = a % 10;\n    if (a > 10 && a < 20) return forms[2];\n    if (b > 1 && b < 5) return forms[1];\n    if (b === 1) return forms[0];\n    return forms[2];\n  }\n\n  // убирает висячие предлоги и союзы: короткое слово приклеивается к следующему\n  nb(s) {\n    const short = 'а|и|в|о|у|к|с|я|не|но|то|за|на|по|из|от|до|со|во|же|ли|бы|их|мы|ты|он|их|про|для|это|как|что|чем|или';\n    return s\n      .replace(new RegExp('(^|[\\\\s(«—])(' + short + ')\\\\s+', 'gi'), '$1$2\\u00A0')\n      .replace(/(\\s)(\\d+)\\s+/g, '$1$2\\u00A0');\n  }\n\n  renderVals() {\n    const start = new Date('2026-08-23T23:59:59+03:00').getTime();\n    const ms = Math.max(0, start - this.state.now);\n    const pad = n => String(n).padStart(2, '0');\n    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;\n    const start2 = new Date('2026-08-20T23:59:59+03:00').getTime();\n    const ms2 = Math.max(0, start2 - this.state.now);\n    const d2 = Math.floor(ms2 / 864e5), h2 = Math.floor(ms2 / 36e5) % 24, m2 = Math.floor(ms2 / 6e4) % 60, s2 = Math.floor(ms2 / 1e3) % 60;\n    const nb = t => this.nb(t);\n\n    const pains = [\n      ['🫥', 'Кажется, что твой контент никому не нужен.'],\n      ['😬', 'Смотришь себя в записи и кринжуешь.'],\n      ['🔁', 'Переснимаешь по десять раз, а потом удаляешь.'],\n      ['🌀', 'Тем много, а выбрать одну не получается.'],\n      ['🤷‍♀️', 'Или кажется, что рассказывать вообще не о чем.'],\n      ['👀', 'Страшно, что увидят знакомые и коллеги.'],\n      ['📅', 'Каждую неделю обещаешь себе начать.'],\n      ['📉', 'Снимаешь, а просмотров нет.']\n    ].map(([e, t]) => ({ e, t: nb(t) }));\n\n    const niches = [\n      ['🤱', 'мама в декрете'], ['🧠', 'психолог'], ['✈️', 'путешествия'], ['👁️', 'мастер ресниц'],\n      ['🍳', 'готовка'], ['🏋️', 'тренер'], ['🧵', 'шитьё и рукоделие'], ['🔮', 'таролог'],\n      ['🌍', 'переехала в другую страну'], ['📸', 'фотограф'], ['💪', 'спорт и зал'], ['📚', 'учитель'],\n      ['🐈', 'животные'], ['✂️', 'парикмахер'], ['🏡', 'дом и уют'], ['⭐', 'астролог'],\n      ['🏃', 'похудение'], ['🎨', 'дизайнер'], ['🍽️', 'еда и рестораны'], ['🥗', 'нутрициолог'],\n      ['👗', 'шмотки и стиль'], ['🧳', 'турагент'], ['👶', 'материнство'], ['🩺', 'медицина'],\n      ['🔨', 'ремонт'], ['💼', 'предприниматель'], ['🎬', 'книги и кино'], ['🔄', 'сменила профессию'],\n      ['🌱', 'сад и дача'], ['🚪', 'вышла из найма'], ['💃', 'танцы'], ['🕊️', 'заново после сорока'],\n      ['🚗', 'машины'], ['🧩', 'особенный ребёнок'], ['🎣', 'рыбалка и походы'], ['📋', 'юрист'],\n      ['❤️', 'отношения'], ['🏘️', 'маленький город'], ['🐓', 'жизнь в деревне'], ['💄', 'бьюти-мастер'],\n      ['🖌️', 'творчество'], ['📊', 'маркетинг'], ['🧿', 'эзотерика'], ['👨‍👩‍👧‍👦', 'многодетная семья'],\n      ['🗽', 'жизнь за границей'], ['🗺️', 'гид']\n    ].map(([e, t]) => ({ e, t }));\n\n    const lessons = [\n      'Продвижение и алгоритмы', 'Как усилить яппинг', 'Как раскрыть себя на камеру',\n      'Съёмка на телефон', 'Простой монтаж', 'Где брать идеи каждый день',\n      'Упаковка профиля', 'Телеграм-канал', 'Монетизация',\n      'Когда охваты просели и снимать перехотелось'\n    ].map(nb);\n\n    const results = [\n      ['🎬', '30 новых рилсов в профиле'],\n      ['🗣️', 'Освоенный метод ЯППИНГА'],\n      ['🎯', 'Понятную тему и форматы, в которых тебе снимать'],\n      ['📈', 'Научишься получать просмотры и новых подписчиков'],\n      ['💡', 'Понимание, что и как снимать каждый день'],\n      ['😌', 'Спокойствие перед камерой, без десяти дублей и удалённых видео'],\n      ['🔥', 'Привычку снимать регулярно'],\n      ['👥', 'Своих людей вокруг, близких по духу']\n    ].map(([e, t]) => ({ e, t: nb(t) }));\n\n    const notFor = [\n      ['🙈', 'Не готова снимать себя. Мы разбираем только выложенные рилсы, снимать в стол тут не получится.'],\n      ['🎭', 'Хочешь вести блог без своего лица. Яппинг это разговор на камеру, по-другому он не работает.'],\n      ['📺', 'Ждёшь, что достаточно купить и посмотреть уроки. Снимать всё равно будешь ты.'],\n      ['🗯️', 'Не готова слышать, что в ролике поправить. Обратная связь тут каждую неделю.']\n    ].map(([e, t]) => ({ e, t: nb(t) }));\n\n    const faq = [\n      ['Сколько стоит участие?', 'Стоимость зависит от формата: «В команде», «В своём темпе» или «Со мной лично». Все условия и варианты оплаты команда расскажет после заявки, там же можно оформить рассрочку до 12 месяцев.'],\n      ['Я уже пробовала курсы, не сработало. Почему тут будет по-другому?', 'На курсе ты одна с уроками. Посмотрела, законспектировала, закрыла вкладку. Здесь каждое утро приходит задание, что снять сегодня, а твой выложенный рилс смотрит куратор. Разница не в уроках, а в том, доводят они тебя до опубликованного в
