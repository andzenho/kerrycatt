<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121517">
<title>Анкета участницы Разминки · Kerry Catt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Oranienbaum&display=swap" rel="stylesheet">
<style>
:root{--ink:#121517;--card:#1B2023;--cream:#F0E7DB;--on:rgba(240,231,219,.86);--muted:rgba(240,231,219,.6);--line:rgba(240,231,219,.16);--red:#B8243A;--red-d:#DD3B50}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(90% 40% at 50% 0%,rgba(184,36,58,.22),rgba(184,36,58,0) 70%),var(--ink);color:var(--cream);font-family:'Manrope',system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:36px 18px 48px}
.kick{text-align:center;font:800 12px/1.2 'Manrope';letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{margin-top:12px;text-align:center;font:400 clamp(40px,11vw,58px)/.95 'Oranienbaum',serif;text-transform:uppercase;background:linear-gradient(180deg,#FFFAF1 0%,#F0E7DB 50%,#B5A593 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:440px;margin:14px auto 0;text-align:center;font:500 16px/1.5 'Manrope';color:var(--on)}
.card{margin-top:28px;padding:22px 18px 22px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
.prog{display:flex;align-items:center;justify-content:space-between;font:800 12px/1 'Manrope';letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prog button{border:0;background:none;color:var(--muted);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:6px 0}
.prog button[hidden]{display:none}
.bar{height:6px;margin-top:12px;border-radius:99px;background:rgba(240,231,219,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--red-d));transition:width .3s}
.q{margin-top:20px;font:800 21px/1.3 'Manrope';color:var(--cream)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{width:100%;padding:16px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(240,231,219,.05);color:var(--cream);font:600 16.5px/1.35 'Manrope';text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{border-color:rgba(240,231,219,.4)}
.opt.on{background:linear-gradient(180deg,#B8243A,#7A1425);border-color:transparent}
.opt:focus-visible,.btn:focus-visible,.in:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.f{margin-top:16px}
.f label{display:block;margin-bottom:8px;font:700 14px/1.3 'Manrope';color:var(--on)}
.in{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--cream);font:600 16.5px/1.3 'Manrope'}
.in::placeholder{color:rgba(240,231,219,.35)}
.in.bad{border-color:var(--red-d)}
.err{margin-top:6px;font:600 13.5px/1.35 'Manrope';color:#FF8A98}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin-top:20px;padding:16px 20px;border:0;border-radius:18px;background:linear-gradient(180deg,#B8243A,#7A1425);box-shadow:0 14px 30px -12px rgba(221,59,80,.8);color:#FFF8EE;font:800 15px/1.2 'Manrope';letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn[disabled]{opacity:.6}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center}
.done .q{margin-top:6px}
.done p{margin-top:12px;font:500 16px/1.5 'Manrope';color:var(--on)}
.sub{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--cream);color:var(--ink);text-align:left;font:600 15.5px/1.4 'Manrope'}
.sub b{font-weight:800}
.sub i{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--red);color:#FFF8EE;font:800 18px/1 'Manrope';font-style:normal}
.note{margin-top:12px;font:600 13.5px/1.4 'Manrope';color:var(--muted)}
.note a{color:var(--cream)}
</style>
</head>
<body>
<main class="wrap">
  <p class="kick">Разминка · 3–6 ноября</p>
  <h1>Анкета участницы</h1>
  <p class="lead">Шесть коротких вопросов. Эксперты будут смотреть твой ролик именно под твою главную задачу</p>
  <div class="card" data-card></div>
</main>
<script src="anketa.js?v=1"></script>
</body>
</html>
